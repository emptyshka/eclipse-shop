<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECLIPSE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>ECLIPSE</h1>

        <nav>
            <a href="#catalog">Каталог</a>
            <a href="#cart">Корзина</a>
        </nav>
    </header>

    <main>
        <section id="catalog">
            <h2>Каталог товаров</h2>

            <div class="products">

                <article class="product-card" data-id="1">
                    <img src="eclipse_images/windbreaker_grey.PNG" alt="Ветровка ECLIPSE">

                    <h3>Ветровка ECLIPSE</h3>
                    <div class="color-buttons">
                        <button class="color-button" data-color="black">Чёрный</button>
                        <button class="color-button" data-color="grey">Серый</button>
                    </div>
                    <p>Цена: 4880 ₽</p>
                    <button class="add-to-cart">Добавить в корзину</button>
                </article>
            
                <article class="product-card" data-id="2">
                    <img src="eclipse_images/pants_grey.PNG" alt="Штаны ECLIPSE">

                    <h3>Штаны ECLIPSE</h3>
                    <div class="color-buttons">
                        <button class="color-button" data-color="black">Чёрный</button>
                        <button class="color-button" data-color="grey">Серый</button>
                    </div>
                    <p>Цена: 3570 ₽</p>
                    <button class="add-to-cart">Добавить в корзину</button>
                </article>
            
                <article class="product-card" data-id="3">
                    <img src="eclipse_images/hoodie_grey.PNG" alt="Худи ECLIPSE">

                    <h3>Худи ECLIPSE</h3>
                    <div class="color-buttons">
                        <button class="color-button" data-color="black">Чёрный</button>
                        <button class="color-button" data-color="grey">Серый</button>
                    </div>
                    <p>Цена: 2990 ₽</p>
                    <button class="add-to-cart">Добавить в корзину</button>
                </article>
            
                <article class="product-card" data-id="4">
                    <img src="eclipse_images/cap_grey.PNG" alt="Кепка ECLIPSE">

                    <h3>Кепка ECLIPSE</h3>
                    <div class="color-buttons">
                        <button class="color-button" data-color="black">Чёрный</button>
                        <button class="color-button" data-color="grey">Серый</button>
                    </div>
                    <p>Цена: 1660 ₽</p>
                    <button class="add-to-cart">Добавить в корзину</button>
                </article>
            
                <article class="product-card" data-id="5">
                    <img src="eclipse_images/socks.PNG" alt="Носки ECLIPSE">

                    <h3>Носки ECLIPSE</h3>
                    <p>Комплект: 3 расцветки</p>
                    <p>Цена: 1111 ₽</p>
                    <button class="add-to-cart">Добавить в корзину</button>
                </article>

            </div>
        </section>

        <section id="cart">
            <h2>Корзина</h2>

            <div id="cart-items"></div>

            <p id="cart-total">Итого: 0 ₽</p>
        </section>

        <section id="order">
            <h2>Оформление заказа</h2>

            <form id="order-form">
                <label>
                    Имя
                    <input type="text" name="firstName" required>
                </label>

                <label>
                    Фамилия
                    <input type="text" name="lastName" required>
                </label>

                <label>
                    Адрес
                    <input type="text" name="address" required>
                </label>

                <label>
                    Телефон
                    <input
                        type="tel"
                        name="phone"
                        placeholder="+7 (999) 123-45-67"
                        pattern="\+7\s?\(?\d{3}\)?\s?\d{3}[-\s]?\d{2}[-\s]?\d{2}"
                        required
                    >
                </label>

                <button type="submit">Оформить заказ</button>
            </form>

            <p id="order-message"></p>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
